name: Build and deploy Docker image to Azure Web App - smu-scorer-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name smuincacr

      - name: Build and push Docker image
        run: |
          docker build . \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            -t smuincacr.azurecr.io/smu-scorer-app:${{ github.sha }} \
            -t smuincacr.azurecr.io/smu-scorer-app:latest
          docker push smuincacr.azurecr.io/smu-scorer-app:${{ github.sha }}
          docker push smuincacr.azurecr.io/smu-scorer-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure App Service environment variables
        run: |
          RG=$(az webapp list --query "[?name=='smu-scorer-app'].resourceGroup" -o tsv)
          az webapp config appsettings set \
            --name smu-scorer-app \
            --resource-group "$RG" \
            --settings \
              SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              SUPABASE_JWT_SECRET="${{ secrets.SUPABASE_JWT_SECRET }}" \
              SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
              NODE_ENV="production" \
              PORT="5000"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'smu-scorer-app'
          images: 'smuincacr.azurecr.io/smu-scorer-app:${{ github.sha }}'
